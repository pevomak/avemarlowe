<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">
<head>

    <!-- SEMANTIC GRAPH & REGISTRY -->

</head>

<body class="bg-surface-base text-slate-900 overflow-x-hidden relative selection:bg-amber-500 selection:text-white">

    <div class="absolute inset-0 z-[-1] pointer-events-none opacity-40 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-amber-100 via-white to-slate-50"></div>

    <div id="app-root">
        <!-- HEADER / LANGUAGE SWITCHER -->
        <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
            <div class="container mx-auto px-6 h-20 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-black text-brand-primary tracking-tighter">avemarlowe<span class="text-amber-600">.pro</span></span>
                    <span class="hidden sm:inline-block text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">Marlowe ave s.r.o.</span>
                </div>
                <div class="flex gap-2 bg-slate-100 p-1 rounded-lg" id="lang-switcher">
                    <!-- Buttons injected via JS -->
                </div>
            </div>
        </header>

        <main id="main-mount" class="lang-transition"></main>

        <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
            <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <p class="font-bold text-white text-lg">Marlowe ave s.r.o.</p>
                    <p class="text-sm mt-1">Varšavská 715/36, Vinohrady (Praha 2), 120 00 Praha</p>
                </div>
                <div class="text-sm text-center md:text-right">
                    <p>&copy; 2026 avemarlowe.pro. All rights reserved.</p>
                    <p class="text-xs text-slate-500 mt-1">IČO: 11911948 | DIČ: CZ11911948</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- ATOMIC COMPONENT TEMPLATES -->
    
    <!-- Hero Template -->
    <template id="tpl-hero">
        <section class="relative py-24 md:py-32 flex items-center">
            <div class="container mx-auto px-6 max-w-4xl text-center">
                <div class="inline-flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-1.5 rounded-full text-xs font-semibold mb-6 shadow-sm">
                    <i data-lucide="award" class="w-4 h-4"></i>
                    <span>Official Corporate Registry Validated</span>
                </div>
                <h1 class="text-4xl md:text-6xl font-black mb-6 text-slate-900 tracking-tight lang-transition leading-tight">{{H1}}</h1>
                <p class="text-lg md:text-xl text-slate-700 mb-10 lang-transition max-w-2xl mx-auto">{{P}}</p>
                <div class="flex flex-wrap justify-center items-center gap-4">
                    <a href="#registry-section" class="bg-brand-primary text-white font-medium px-8 py-3.5 rounded-xl shadow-lg hover:bg-slate-800 transition-colors inline-flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-5 h-5 text-amber-400"></i>
                        <span>Corporate Intelligence</span>
                    </a>
                    <div class="inline-flex items-center gap-2 text-slate-800 font-semibold bg-white border border-slate-200 px-6 py-3.5 rounded-xl shadow-sm">
                        <i data-lucide="phone" class="w-5 h-5 text-amber-600"></i>
                        <span>{{PHONE}}</span>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <!-- Services Template -->
    <template id="tpl-services">
        <section class="py-20 bg-surface-muted">
            <div class="container mx-auto px-6">
                <h2 class="text-3xl font-bold text-center mb-12 lang-transition">{{SECTION_TITLE}}</h2>
                <div class="grid md:grid-cols-3 gap-8" id="services-grid-{{ID}}">
                    <!-- Service cards injected dynamically -->
                </div>
            </div>
        </section>
    </template>

    <!-- Gallery Template -->
    <template id="tpl-gallery">
        <section class="py-20 bg-white">
            <div class="container mx-auto px-6">
                <div class="text-center max-w-2xl mx-auto mb-16">
                    <span class="text-amber-600 font-semibold text-sm uppercase tracking-wider mb-2 block">Visual Showcase</span>
                    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 lang-transition">{{GALLERY_TITLE}}</h2>
                </div>
                <div class="grid md:grid-cols-3 gap-8">
                    <div class="group relative overflow-hidden rounded-2xl shadow-xl bg-slate-900 border border-slate-200 aspect-[4/3]">
                        <img src="unnamed (1).jpg" alt="Custom Car Air Fresheners in Action" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-95 group-hover:opacity-100" onerror="this.src='https://placehold.co/800x600/0f172a/ffffff?text=Product+Showcase+1'">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-6">
                            <p class="text-white font-medium text-sm">Bespoke Hanging Fresheners & Retail Kits</p>
                        </div>
                    </div>
                    <div class="group relative overflow-hidden rounded-2xl shadow-xl bg-slate-900 border border-slate-200 aspect-[4/3]">
                        <img src="unnamed.jpg" alt="Car Interior Cosmetics and Sprays" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-95 group-hover:opacity-100" onerror="this.src='https://placehold.co/800x600/0f172a/ffffff?text=Product+Showcase+2'">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-6">
                            <p class="text-white font-medium text-sm">Professional Interior Care Formulations</p>
                        </div>
                    </div>
                    <div class="group relative overflow-hidden rounded-2xl shadow-xl bg-slate-900 border border-slate-200 aspect-[4/3]">
                        <img src="unnamed (2).jpg" alt="Fragrance Collections & Displays" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-95 group-hover:opacity-100" onerror="this.src='https://placehold.co/800x600/0f172a/ffffff?text=Product+Showcase+3'">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-6">
                            <p class="text-white font-medium text-sm">Custom Scented Collections & Merchandising</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <!-- Company Registry Template -->
    <template id="tpl-registry">
        <section id="registry-section" class="py-20 bg-surface-muted">
            <div class="container mx-auto px-6 max-w-5xl">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 md:p-12">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="p-3 bg-brand-primary/10 text-brand-primary rounded-lg">
                            <i data-lucide="building-2" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-3xl font-bold lang-transition">{{REGISTRY_TITLE}}</h2>
                    </div>

                    <div class="grid md:grid-cols-2 gap-x-12 gap-y-8">
                        <!-- Official Details -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider lang-transition">{{LBL_LEGAL}}</h3>
                            <ul class="space-y-3">
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500 lang-transition">{{LBL_NAME}}</span>
                                    <span class="font-medium">{{LEGAL_NAME}}</span>
                                </li>
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500">IČO</span>
                                    <span class="font-medium">{{ICO}}</span>
                                </li>
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500">VAT / DIČ</span>
                                    <span class="font-medium">{{VAT_NUMBER}} <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">{{VAT_STATUS}}</span></span>
                                </li>
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500 lang-transition">{{LBL_REGISTRAR}}</span>
                                    <span class="font-medium text-right text-sm">{{REGISTRAR}}</span>
                                </li>
                            </ul>
                        </div>

                        <!-- Economic & Social -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider lang-transition">{{LBL_ECO}}</h3>
                            <ul class="space-y-3">
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500 lang-transition">{{LBL_EQUITY}}</span>
                                    <span class="font-medium">{{EQUITY}}</span>
                                </li>
                                <li class="flex justify-between border-b border-slate-100 pb-2">
                                    <span class="text-slate-500">Facebook</span>
                                    <a href="{{FACEBOOK}}" target="_blank" class="text-brand-primary hover:underline flex items-center gap-1">
                                        <i data-lucide="external-link" class="w-4 h-4"></i> Profile
                                    </a>
                                </li>
                            </ul>
                            
                            <div class="pt-4">
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 lang-transition">{{LBL_PARTNERS}}</h3>
                                <div class="flex flex-wrap gap-2" id="partners-{{ID}}">
                                    <!-- Partners injected -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <script>
        const Engine = {
            state: 'LANG1', // Default Language Code (Czech)
            graph: JSON.parse(document.getElementById('semantic-graph').text),

            init: function() {
                this.renderSwitcher();
                this.render();
            },

            setLanguage: function(langKey) {
                if(this.state === langKey) return;
                this.state = langKey;
                
                const main = document.getElementById('main-mount');
                main.style.opacity = 0;
                setTimeout(() => {
                    this.renderSwitcher();
                    this.render();
                    main.style.opacity = 1;
                }, 300);
            },

            renderSwitcher: function() {
                const container = document.getElementById('lang-switcher');
                container.innerHTML = '';
                ['LANG1', 'LANG2'].forEach(lang => {
                    const isActive = this.state === lang;
                    const btn = document.createElement('button');
                    btn.className = `px-4 py-2 rounded-md text-sm font-semibold transition-all ${isActive ? 'bg-white shadow text-slate-900' : 'text-slate-500 hover:text-slate-900'}`;
                    btn.innerText = this.graph.languages[lang].label;
                    btn.onclick = () => this.setLanguage(lang);
                    container.appendChild(btn);
                });
            },

            render: function() {
                const langData = this.graph.languages[this.state];
                const content = langData.content;
                const regData = this.graph.registry;
                const main = document.getElementById('main-mount');
                main.innerHTML = ''; 

                // SEO & Title update
                document.title = langData.metaTitle;
                document.documentElement.lang = langData.code;

                this.graph.components.forEach((comp, idx) => {
                    if(comp.type === 'HERO') {
                        main.insertAdjacentHTML('beforeend', this.compile('tpl-hero', {
                            H1: content.HERO.H1,
                            P: content.HERO.P,
                            PHONE: this.graph.identity.phone
                        }));
                    }

                    if(comp.type === 'SERVICES') {
                        let servicesHtml = this.compile('tpl-services', {
                            ID: idx,
                            SECTION_TITLE: content.SERVICES_TITLE
                        });
                        main.insertAdjacentHTML('beforeend', servicesHtml);
                        
                        const grid = document.getElementById(`services-grid-${idx}`);
                        content.SERVICES.forEach(svc => {
                            grid.insertAdjacentHTML('beforeend', `
                                <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow lang-transition border border-slate-100">
                                    <i data-lucide="${svc.ICON}" class="w-8 h-8 text-brand-primary mb-4"></i>
                                    <h3 class="text-xl font-bold mb-2">${svc.TITLE}</h3>
                                    <p class="text-slate-600">${svc.DESC}</p>
                                </div>
                            `);
                        });
                    }

                    if(comp.type === 'GALLERY') {
                        main.insertAdjacentHTML('beforeend', this.compile('tpl-gallery', {
                            GALLERY_TITLE: content.GALLERY_TITLE
                        }));
                    }

                    if(comp.type === 'COMPANY_DATA') {
                        let registryHtml = this.compile('tpl-registry', {
                            ID: idx,
                            REGISTRY_TITLE: content.UI.REGISTRY_TITLE,
                            LBL_LEGAL: content.UI.LBL_LEGAL,
                            LBL_NAME: content.UI.LBL_NAME,
                            LBL_REGISTRAR: content.UI.LBL_REGISTRAR,
                            LBL_ECO: content.UI.LBL_ECO,
                            LBL_EQUITY: content.UI.LBL_EQUITY,
                            LBL_PARTNERS: content.UI.LBL_PARTNERS,
                            
                            LEGAL_NAME: this.graph.identity.legalName,
                            ICO: this.graph.identity.ico,
                            VAT_NUMBER: regData.vatNumber,
                            VAT_STATUS: regData.vatStatus,
                            REGISTRAR: regData.registrar,
                            EQUITY: regData.equity,
                            FACEBOOK: regData.facebook
                        });
                        main.insertAdjacentHTML('beforeend', registryHtml);

                        const partnersContainer = document.getElementById(`partners-${idx}`);
                        regData.partners.forEach(partner => {
                            partnersContainer.insertAdjacentHTML('beforeend', `
                                <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold">${partner}</span>
                            `);
                        });
                    }
                });

                // Re-initialize Lucide Icons dynamically after rendering
                lucide.createIcons();
            },

            compile: function(tplId, data) {
                let html = document.getElementById(tplId).innerHTML;
                Object.keys(data).forEach(key => {
                    html = html.split(`{{${key}}}`).join(data[key]);
                });
                return html;
            }
        };

        document.addEventListener('DOMContentLoaded', () => Engine.init());
    </script>
</body>
</html>
